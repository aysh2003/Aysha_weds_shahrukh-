<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#222428">

<title>Aysha Weds Shahrukh</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>

/* ==============================
   THEME  –  Smoky Gray & Silver White
============================== */

:root {
    --bg-deep:   #222428;
    --bg-emerald:#484c52;
    --gold-1:    #ffffff;
    --gold-2:    #cdd0d6;
    --gold-3:    #8d9199;
    --ivory:     #f7f8fa;
    --ivory-soft:#dfe1e5;
    --muted:     #a3a7ae;

    --gold-gradient: linear-gradient(120deg, #8d9199 0%, #ffffff 30%, #cdd0d6 50%, #ffffff 70%, #8d9199 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    position: relative;
    background: var(--bg-deep);
    color: var(--ivory);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

/* shimmer text helper */
.gold-text {
    background: var(--gold-gradient);
    background-size: 220% auto;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: shimmer 7s linear infinite;
}

@keyframes shimmer {
    to { background-position: 220% center; }
}

/* bride & groom name colour (solid, no shimmer) */
.name-silver {
    color: #ffffff;
    -webkit-text-fill-color: #ffffff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

/* ==============================
   OPENING COVER
============================== */

#cover {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
}

#cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
}

.cover-overlay {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to bottom, rgba(34,36,40,0.1), rgba(34,36,40,0.25), rgba(34,36,40,0.75));
}

.cover-frame {
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(205,208,214,0.55);
    pointer-events: none;
}
.cover-frame::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(205,208,214,0.25);
}

.tap-wrap {
    position: absolute;
    bottom: 9%;
    z-index: 2;
    text-align: center;
}

.tap-text {
    display: inline-block;
    padding: 13px 34px;
    color: var(--gold-1);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    border: 1px solid rgba(205,208,214,0.7);
    background: rgba(34,36,40,0.45);
    backdrop-filter: blur(6px);
    animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.55; transform: translateY(0); }
    50%      { opacity: 1;    transform: translateY(-4px); }
}

/* ==============================
   BACKGROUND (flows top to bottom)
============================== */

.bg-layer {
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
        url("wedding-background.png") top center / 100% 100% no-repeat,
        var(--bg-deep);
}

.bg-tint {
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
        linear-gradient(180deg,
            rgba(34,36,40,0.28) 0%,
            rgba(72,76,82,0.12) 25%,
            rgba(72,76,82,0.12) 75%,
            rgba(34,36,40,0.30) 100%);
    pointer-events: none;
}

#sparkles {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
}

/* scroll progress */
#progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0;
    z-index: 600;
    background: var(--gold-gradient);
}

/* ==============================
   MAIN WEBSITE
============================== */

#website {
    display: none;
    position: relative;
    min-height: 100vh;
}

/* ==============================
   MUSIC BUTTON
============================== */

.music-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 500;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(205,208,214,0.7);
    color: var(--gold-1);
    background: rgba(34,36,40,0.65);
    font-size: 17px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.4s;
}
.music-btn:hover { background: rgba(205,208,214,0.2); }
.music-btn.playing { animation: spin-glow 4s linear infinite; }

@keyframes spin-glow {
    0%,100% { box-shadow: 0 0 0 0 rgba(205,208,214,0.45); }
    50%     { box-shadow: 0 0 0 9px rgba(205,208,214,0); }
}

/* ==============================
   COMMON SECTIONS
============================== */

.section {
    min-height: 100vh;
    padding: 80px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
}

.content {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: auto;
    padding: 58px 30px;
    background: linear-gradient(160deg, rgba(72,76,82,0.38), rgba(34,36,40,0.45));
    border: 1px solid rgba(205,208,214,0.45);
    box-shadow: 0 25px 70px rgba(0,0,0,0.5), inset 0 0 60px rgba(205,208,214,0.05);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

/* inner fine frame */
.content::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(205,208,214,0.2);
    pointer-events: none;
}

/* corner ornaments */
.corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 1.5px solid var(--gold-2);
    pointer-events: none;
}
.corner.tl { top: -1px;    left: -1px;  border-right: none; border-bottom: none; }
.corner.tr { top: -1px;    right: -1px; border-left: none;  border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px;  border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none;  border-top: none; }

.small-heading {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gold-2);
    margin-bottom: 22px;
}

h1, h2, h3 { font-weight: 400; }

.main-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(30px, 6vw, 46px);
    line-height: 1.35;
    letter-spacing: 1px;
    color: var(--ivory);
    margin-bottom: 20px;
}

/* ornamental divider */
.ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 28px auto;
    max-width: 280px;
}
.ornament::before,
.ornament::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-2));
}
.ornament::after { transform: scaleX(-1); }
.ornament span {
    color: var(--gold-2);
    font-size: 15px;
    line-height: 1;
}

/* ==============================
   SECTION 1 - INVITATION
============================== */

.bismillah {
    font-family: 'Amiri', serif;
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.9;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 12px rgba(205,208,214,0.35));
}

.couple-names {
    font-family: 'Alex Brush', 'Allura', cursive;
    font-size: clamp(66px, 15vw, 118px);
    line-height: 1.05;
    font-weight: normal;
    font-style: italic;
    letter-spacing: 1px;
    padding: 0 8px;
}

.weds {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 9px;
    color: var(--ivory-soft);
    margin: 6px 0
